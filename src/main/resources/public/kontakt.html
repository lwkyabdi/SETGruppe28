<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontakt – Østfold Husflidslag</title>
  <meta name="description" content="Studentdemo av kurs og informasjon for Østfold Husflidslag.">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/site.css">
  <script src="/webjars/vue/3.5.41/dist/vue.global.prod.js" defer></script>
  <script src="/site.js" defer></script>
</head>
<body data-page="kontakt">
<noscript>Denne demoen trenger JavaScript for å hente og vise kurs.</noscript>
<div id="app" v-cloak>
  <site-header active="kontakt"></site-header>
<main class="side">
  <header class="sidetopp"><h1>Kontakt oss</h1><p>Kontaktpersoner for de publiserte kursene</p></header>
  <p v-if="loading" role="status">Henter kurs …</p>
<p v-if="error" class="feilmelding" role="alert">{{ error }} <button type="button" @click="load">Prøv igjen</button></p>
  <p v-if="!loading && !error && contacts.length === 0">Ingen kurskontakter er tilgjengelige akkurat nå.</p>
  <ul class="kortliste" v-if="!loading && !error"><li v-for="p in contacts" :key="p.id">
    <article class="kort kontaktkort"><img :src="p.bilde" alt="Illustrasjon av en kontaktperson"><h2>{{ p.navn }}</h2>
      <p><a :href="'mailto:' + p.epost">{{ p.epost }}</a></p><p><a :href="'tel:' + p.telefon">{{ p.telefon }}</a></p>
    </article>
  </li></ul>
</main>
  <site-footer></site-footer>
</div>
</body>
</html>
